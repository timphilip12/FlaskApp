name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Job 1 : Tests unitaires
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.1'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (avec erreur volontaire)
        run: |
          pytestx   # ❌ commande volontairement fausse pour tester la notification

  # Job 2 : Build & Push Docker (seulement si tests OK)
  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest

  # Job 3 : Notification email si tests échouent
  notify:
    runs-on: ubuntu-latest
    needs: tests
    if: failure()   # ✔️ exécuté uniquement si "tests" échoue
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "⚠️ CI ÉCHEC : Les tests ont échoué"
          to: "ton.email@example.com"
          from: "ci-bot@example.com"
          body: "Le job CI a échoué pendant les tests. Consulte les logs dans GitHub Actions."
